# API 개발용. Expo/Metro는 Windows의 GagebuClient에서 실행한다.
# PowerShell: .\scripts\dev.ps1 start
name: gageabu

services:
  api:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    init: true
    working_dir: /workspace/Gagebu_RestApiVer/Gagebu Server/Gagebu Server
    command: ["dotnet", "watch", "--non-interactive", "run", "--no-launch-profile"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/workspace:cached
      - nuget-packages:/home/node/.nuget/packages
      - api-artifacts:/home/node/.gagebu-artifacts
      - claude-config:/home/node/.claude
    environment:
      TZ: Asia/Seoul
      CLAUDE_CONFIG_DIR: /home/node/.claude
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "true"
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "true"
      # 컨테이너끼리는 서비스 이름(db)으로 접속한다
      ConnectionStrings__Gagebu: Host=db;Port=5432;Database=gageabu;Username=gagebu;Password=${POSTGRES_PASSWORD:-gagebu_dev}
      # 인증 (개발용 값). 운영에서는 JwtKey를 비밀 값으로 넣고 아래 두 플래그는 끈다 (Development가 아니면 어차피 무시됨)
      Auth__JwtKey: ${GAGEBU_JWT_KEY:-dev-only-jwt-signing-key-not-for-production}
      Auth__DevLoginEnabled: "true"
      # 토큰 없이 온 요청 = 기본 가계부 (로그인 화면이 생기기 전까지 지금 앱이 그대로 동작하도록)
      Auth__AllowAnonymous: "true"
      # 카카오 로그인 시험용 (루트 .env에 KAKAO_APP_ID). 비우면 꺼짐
      Kakao__AppId: ${KAKAO_APP_ID:-}
      # 영수증 분석 워커가 /internal API를 부를 때 쓰는 키 (개발용 값)
      Worker__Key: ${GAGEBU_WORKER_KEY:-dev-only-worker-key-0123456789}
    ports:
      - "5067:5067"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5067/health"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

  # 영수증 분석 워커 (Python). API의 /internal/receipts에서 작업을 가져가 추천을 돌려준다
  # 테스트: .\scripts\dev.ps1 worker-test
  worker:
    build:
      context: ./receipt-worker
      target: dev
    init: true
    depends_on:
      api:
        condition: service_healthy
    volumes:
      # 코드를 고치면 docker compose restart worker로 반영
      - ./receipt-worker:/app
    environment:
      GAGEBU_API_URL: http://api:5067
      GAGEBU_WORKER_KEY: ${GAGEBU_WORKER_KEY:-dev-only-worker-key-0123456789}

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gageabu
      POSTGRES_USER: gagebu
      # 개발용 기본값. 바꾸려면 루트 .env에 POSTGRES_PASSWORD를 넣는다 (볼륨을 처음 만들 때만 적용됨)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gagebu_dev}
      TZ: Asia/Seoul
    volumes:
      # DB 데이터. down -v로 삭제하지 않는다.
      - pg-data:/var/lib/postgresql
    ports:
      # PC 안에서만 접속 (DBeaver 등). 같은 와이파이의 다른 기기에서는 접속 불가
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gagebu -d gageabu"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

volumes:
  nuget-packages:
  api-artifacts:
  pg-data:
  # 이전 SQLite DB (2026-09-27 PostgreSQL 전환 전). 더 이상 마운트하지 않지만 롤백용으로 보존한다.
  gagebu-db:
  claude-config:
