# 운영용 (클라우드 VM 등 Linux 서버에서). 개발은 docker-compose.yml.
# 사용법: docs/DEPLOY.md
#   cp .env.prod.example .env.prod   # 값 채우기
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: gageabu-prod

services:
  api:
    # 서버에서 빌드(--build)하거나, PC에서 빌드해 보낸 이미지(deploy/push-images.sh)를 그대로 쓴다(--no-build)
    image: gageabu-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Asia/Seoul
      ConnectionStrings__Gagebu: Host=db;Port=5432;Database=gageabu;Username=gagebu;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env.prod에 넣으세요}
      Auth__JwtKey: ${GAGEBU_JWT_KEY:?GAGEBU_JWT_KEY를 .env.prod에 넣으세요 (32자 이상 무작위)}
      # 브라우저에서 부를 주소가 있을 때만 (폰 앱은 필요 없음)
      Cors__AllowedOrigins__0: ${GAGEBU_WEB_ORIGIN:-}
      # 카카오 로그인: 카카오 개발자 콘솔의 앱 ID(숫자). 비우면 /api/auth/kakao는 503
      Kakao__AppId: ${KAKAO_APP_ID:-}
      # 영수증 분석 워커 전용 API 키 (16자 이상). 비우면 워커 API 꺼짐
      Worker__Key: ${GAGEBU_WORKER_KEY:-}
    # 포트를 밖으로 열지 않는다. 바깥 요청은 caddy(HTTPS)만 받아서 넘긴다
    expose:
      - "5067"

  # 영수증 분석 워커. GAGEBU_WORKER_KEY가 비어 있으면 1분마다 경고만 남기고 쉰다
  worker:
    image: gageabu-worker:latest
    build:
      context: ./receipt-worker
      target: prod
    restart: unless-stopped
    depends_on:
      - api
    environment:
      GAGEBU_API_URL: http://api:5067
      GAGEBU_WORKER_KEY: ${GAGEBU_WORKER_KEY:-}

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gageabu
      POSTGRES_USER: gagebu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env.prod에 넣으세요}
      TZ: Asia/Seoul
    volumes:
      # 운영 데이터. down -v 금지
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gagebu -d gageabu"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

  # HTTPS: 도메인만 주면 인증서(Let's Encrypt)를 자동으로 받고 갱신한다
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      GAGEBU_DOMAIN: ${GAGEBU_DOMAIN:?GAGEBU_DOMAIN을 .env.prod에 넣으세요 (예 api.example.com)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pg-data:
  caddy-data:
  caddy-config:
